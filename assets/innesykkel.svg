<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="boltGradient" x1="345" y1="85" x2="805" y2="825" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8af7ff"/>
      <stop offset=".48" stop-color="#19d0e8"/>
      <stop offset="1" stop-color="#246bff"/>
    </linearGradient>
    <linearGradient id="bikeGradient" x1="250" y1="350" x2="760" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a5fbff"/>
      <stop offset=".45" stop-color="#19d0e8"/>
      <stop offset="1" stop-color="#2878ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="boltGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="19" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Lightning bolt behind the bicycle -->
  <path d="M720 85 L425 430 L575 430 L345 825 L805 335 L625 335 Z"
        fill="url(#boltGradient)" opacity=".98" filter="url(#boltGlow)"/>

  <!-- Thin light outline separates the bicycle from the lightning -->
  <g fill="none" stroke="#e8fcff" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="278" cy="690" r="154" stroke-width="33"/>
    <circle cx="746" cy="690" r="154" stroke-width="33"/>
    <path d="M278 690 L442 420 L575 690 L278 690 L535 690 L746 690"
          stroke-width="34"/>
    <path d="M442 420 L535 690" stroke-width="34"/>
    <path d="M746 690 L690 397 L650 397" stroke-width="33"/>
    <path d="M650 397 L722 397 L752 420" stroke-width="33"/>
    <path d="M442 420 L420 365" stroke-width="31"/>
    <path d="M380 365 L460 365" stroke-width="33"/>
    <circle cx="535" cy="690" r="34" stroke-width="28"/>
    <path d="M535 690 L585 735 M510 735 L560 735" stroke-width="27"/>
  </g>

  <!-- Bicycle with blue to cyan gradient -->
  <g fill="none" stroke="url(#bikeGradient)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <circle cx="278" cy="690" r="154" stroke-width="24"/>
    <circle cx="746" cy="690" r="154" stroke-width="24"/>
    <path d="M278 690 L442 420 L575 690 L278 690 L535 690 L746 690"
          stroke-width="25"/>
    <path d="M442 420 L535 690" stroke-width="25"/>
    <path d="M746 690 L690 397 L650 397" stroke-width="24"/>
    <path d="M650 397 L722 397 L752 420" stroke-width="24"/>
    <path d="M442 420 L420 365" stroke-width="22"/>
    <path d="M380 365 L460 365" stroke-width="24"/>
    <circle cx="535" cy="690" r="34" stroke-width="20"/>
    <path d="M535 690 L585 735 M510 735 L560 735" stroke-width="19"/>
  </g>
</svg>