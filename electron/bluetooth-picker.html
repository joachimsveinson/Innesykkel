<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Velg Bluetooth-enhet</title>
  <style>
    :root { color-scheme: light; font: 14px -apple-system, BlinkMacSystemFont, sans-serif; }
    body { margin: 0; padding: 24px; color: #202124; background: #f7f7f7; }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0 0 18px; color: #555; line-height: 1.45; }
    #status { padding: 14px; border-radius: 8px; background: #fff; border: 1px solid #ddd; }
    #devices { display: grid; gap: 8px; margin-top: 12px; }
    button { min-height: 42px; padding: 9px 12px; border: 1px solid #bbb; border-radius: 7px; background: white; color: #202124; font: inherit; text-align: left; cursor: pointer; }
    button:hover { background: #eef3fa; }
    button:focus-visible { outline: 2px solid #2767c5; outline-offset: 2px; }
    footer { display: flex; justify-content: flex-end; margin-top: 22px; }
    .cancel { text-align: center; min-width: 100px; }
  </style>
</head>
<body>
  <h1>Velg Bluetooth-enhet</h1>
  <p>Slå på sensoren og hold den nær datamaskinen. Listen oppdateres automatisk.</p>
  <div id="status" role="status" aria-live="polite">Søker etter Bluetooth-enheter …</div>
  <div id="devices"></div>
  <footer><button class="cancel" id="cancel" type="button">Avbryt</button></footer>
  <script>
    const status = document.getElementById('status')
    const devices = document.getElementById('devices')
    window.bluetoothPicker.onUpdate(data => {
      devices.replaceChildren()
      const found = Array.isArray(data.devices) ? data.devices : []
      if (!found.length) {
        status.textContent = 'Søker etter Bluetooth-enheter … Kontroller at sensoren er slått på.'
        return
      }
      status.textContent = found.length === 1 ? 'Fant 1 enhet.' : 'Fant ' + found.length + ' enheter.'
      for (const device of found) {
        const button = document.createElement('button')
        button.type = 'button'
        button.textContent = device.name
        button.addEventListener('click', () => window.bluetoothPicker.select(device.id), { once: true })
        devices.append(button)
      }
    })
    document.getElementById('cancel').addEventListener('click', () => window.bluetoothPicker.cancel())
  </script>
</body>
</html>
